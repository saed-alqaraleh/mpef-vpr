name: CPU package and evidence checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: python -m pytest -q tests
      - name: Verify archived result audit
        run: python scripts/verify_release.py
      - name: Quick start smoke test
        run: python scripts/quickstart.py --backend disk
